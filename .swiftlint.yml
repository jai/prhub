included:
  - PRKit/Sources
  - PRKit/Tests
  - app/PRHub
  - app/PRHubTests
  - app/PRHubUITests

excluded:
  - app/PRHub.xcodeproj
  - app/build
  - .build

reporter: xcode

line_length:
  warning: 120
  error: 160
  ignores_comments: true

identifier_name:
  excluded:
    - id
    - kcal
    - g
    - mg
    - ml
    - tz
    - op

trailing_comma:
  mandatory_comma: true

# `CodingKeys` inside a namespaced request/response type is two levels deep.
nesting:
  type_level: 2

disabled_rules:
  - todo

custom_rules:
  # A value held in @State survives SwiftUI reusing the view, so one seeded from an argument can end up beside a different
  # argument: that showed one PR under another's title. PR screens read from `PRSession`.
  pr_state_seeded_from_arguments:
    included: ".*/PRKit/Sources/PRKit/.*\\.swift"
    regex: "State\\(initialValue:"
    message: "PR state lives in PRSession, not in @State seeded from an argument."
    severity: error
  pr_stock_button:
    included: ".*/PRKit/Sources/PRKit/.*\\.swift"
    regex: "buttonStyle\\(\\.bordered"
    message: "A PR's buttons are PRButtonStyle: the system's are capsules (DESIGN.md)."
    severity: error
