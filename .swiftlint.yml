# DurableNetworking's rules (no_direct_networking, no_network_framework_import): every request goes through its
# transports. Pinned to the tag Package.swift resolves.
parent_config: https://raw.githubusercontent.com/jai/durable-networking/v0.4.0/swiftlint/hosts.yml

included:
  - PRKit/Sources
  - PRKit/Tests
  - app/PRHub
  - app/PRHubCore
  - app/PRHubE2ETests
  - app/PRHubTests
  - app/PRHubUITests
  - app/PRHubPerformanceTests
  - app/PRHubRenderingTests

excluded:
  - PRKit/Sources/PRKitDesign/DesignTokens.swift # generated by app/Tools/design (make -C app design)
  - app/PRHub.xcodeproj
  - app/build
  - .build

reporter: xcode

# make lint runs SwiftLint with --strict, so a warning fails. The limits below were set when it first ran that way
# (2026-11-16), so the code as it was passes; lower one once the code under it shrinks.
line_length:
  warning: 150
  error: 160
  ignores_comments: true
file_length:
  warning: 850
type_body_length:
  warning: 400
function_body_length:
  warning: 60
cyclomatic_complexity:
  warning: 15
large_tuple:
  warning: 3
function_parameter_count:
  warning: 6

identifier_name:
  excluded:
    - ai
    - ok
    - "on"
    - os
    - up
    - id
    - kcal
    - g
    - mg
    - ml
    - tz
    - op


# `CodingKeys` inside a namespaced request/response type is two levels deep.
nesting:
  type_level: 3

disabled_rules:
  - opening_brace # SwiftFormat owns brace placement: it puts a multi-line condition's brace on its own line.
  - todo
  # SwiftFormat owns layout: commas (.swiftformat --commas always) and where an else goes.
  - trailing_comma
  - statement_position
  # String(decoding:as:) is meant: text is read leniently, never dropped.
  - optional_data_string_conversion
  - void_function_in_ternary

custom_rules:
  # A value held in @State survives SwiftUI reusing the view, so one seeded from an argument can end up beside a different
  # argument: that showed one PR under another's title. PR screens read from `PRSession`.
  pr_state_seeded_from_arguments:
    included: ".*/PRKit/Sources/PRKit/.*\\.swift"
    regex: "State\\(initialValue:"
    message: "PR state lives in PRSession, not in @State seeded from an argument."
    severity: error
  pr_stock_button:
    included: ".*/PRKit/Sources/PRKit/.*\\.swift"
    regex: "buttonStyle\\(\\.bordered"
    message: "A PR's buttons are PRButtonStyle: the system's are capsules (DESIGN.md)."
    severity: error
  # DESIGN.md's tokens own every font, colour, gap, corner, animation and SF Symbol in view code. A real exception:
  # `// swiftlint:disable:next design_<rule>` with the reason. `excluded`: files waiting on a token or the navigation rework.
  design_font:
    excluded: '.*/PRKit/Sources/PRKit/(DiffStyle|Phone/DiffTableCells|Mac/DiffTableCells\+Mac)\.swift'
    included: '.*/(PRKit/Sources/PRKit|PRKit/Sources/FeatureKit|app/PRHub)/.*\.swift'
    regex: '\.system\(\s*size:|\.custom\(|(?:UI|NS)Font\.(?:systemFont|monospacedSystemFont)\(ofSize:\s*\d|\.font\(\s*\.(?:largeTitle|title|title2|title3|headline|subheadline|body|callout|footnote|caption|caption2)\b'
    excluded_match_kinds: [comment, doccomment]
    message: 'A font size or system text style: use an AppFont style (.appFootnote, .app(.caption, design: .monospaced)), DESIGN.md.'
    severity: error
  design_colour:
    excluded: '.*/PRKit/Sources/PRKit/(DiffStyle|Phone/DiffTableCells|Mac/DiffTableCells\+Mac)\.swift'
    included: '.*/(PRKit/Sources/PRKit|PRKit/Sources/FeatureKit|app/PRHub)/.*\.swift'
    regex: '(?:Color|UIColor|NSColor)\(\s*(?:red|white|hue|srgbRed|displayP3Red):|#colorLiteral|Color\(\s*"|(?:\bColor|(?:UI|NS)Color)\.(?:red|green|blue|orange|yellow|purple|pink|gray|grey|black|white|teal|indigo|mint|cyan|brown)\b|\bsystem(?:Red|Green|Blue|Orange|Yellow|Purple|Pink|Gray|Teal|Indigo|Mint|Cyan|Brown)\b|(?:foregroundStyle|foregroundColor|tint|fill|stroke|strokeBorder|background)\(\s*\.(?:red|green|blue|orange|yellow|purple|pink|gray|grey|black|white|teal|indigo|mint|cyan|brown)\b|tint:\s*\.(?:red|green|blue|orange|yellow|purple|pink|gray|grey|black|white|teal|indigo|mint|cyan|brown)\b'
    excluded_match_kinds: [comment, doccomment]
    message: 'A colour: use its role (Color.toneGood, .inkQuiet, .groundCard) from AppColor.swift, DESIGN.md.'
    severity: error
  design_space:
    excluded: '.*/PRKit/Sources/PRKit/(DiffStyle|Phone/DiffTableCells|Mac/DiffTableCells\+Mac)\.swift'
    included: '.*/(PRKit/Sources/PRKit|PRKit/Sources/FeatureKit|app/PRHub)/.*\.swift'
    regex: '\.padding\(\s*(?:(?:\.\w+|\[[^\]]*\])\s*,\s*)?-?(?:\d*\.)?\d*[1-9]\d*(?:\.\d+)?\s*\)|\bspacing:\s*-?(?:\d*\.)?\d*[1-9]\d*(?:\.\d+)?\b|EdgeInsets\([^)]*:\s*-?(?:\d*\.)?\d*[1-9]\d*(?:\.\d+)?'
    excluded_match_kinds: [comment, doccomment]
    message: 'A padding or gap: use a Space step, or the part''s measure in PRKitDesign/Metrics.swift, DESIGN.md.'
    severity: error
  design_corner:
    excluded: '.*/PRKit/Sources/PRKit/(DiffStyle|Phone/DiffTableCells|Mac/DiffTableCells\+Mac)\.swift'
    included: '.*/(PRKit/Sources/PRKit|PRKit/Sources/FeatureKit|app/PRHub)/.*\.swift'
    regex: 'cornerRadius:\s*-?(?:\d*\.)?\d*[1-9]\d*(?:\.\d+)?\b|\.cornerRadius\(\s*-?(?:\d*\.)?\d*[1-9]\d*(?:\.\d+)?'
    excluded_match_kinds: [comment, doccomment]
    message: 'A corner: use Radius or the part''s measure in PRKitDesign/Metrics.swift, DESIGN.md.'
    severity: error
  design_motion:
    excluded: '.*/PRKit/Sources/PRKit/(DiffStyle|Phone/DiffTableCells|Mac/DiffTableCells\+Mac)\.swift'
    included: '.*/(PRKit/Sources/PRKit|PRKit/Sources/FeatureKit|app/PRHub)/.*\.swift'
    regex: '(?:withAnimation|\.animation|Transaction\(animation:)\s*\(?\s*(?:Animation)?\.(?:easeInOut|easeIn|easeOut|linear|spring|snappy|smooth|bouncy|interpolatingSpring|default)\b|\bAnimation\.(?:easeInOut|easeIn|easeOut|linear|spring|snappy|smooth|bouncy|interpolatingSpring|default)\b|withAnimation\s*\{'
    excluded_match_kinds: [comment, doccomment]
    message: 'An animation: use AppMotion (.fold, .swap, .press, .screen), DESIGN.md.'
    severity: error
  design_symbols:
    included: '.*/(PRKit/Sources/PRKit|PRKit/Sources/FeatureKit|app/PRHub)/.*\.swift'
    excluded: ['.*/PRKit/Sources/PRKit/(DiffStyle|Phone/DiffTableCells|Mac/DiffTableCells\+Mac)\.swift', '.*/(PRKit/Sources/PRKit/(PRScreen|PRDiffPage|PRDescriptionView|PRsView|Lists/PrListBlock|Parts/PlatformModifiers|PRThreadCard|Lists/LinearParts|Parts/Composer)|app/PRHub/App/PRHubRootView)\.swift']
    regex: '\b(?:systemName|systemImage):\s*[^,)]*"|\bsymbol\s*=\s*"'
    excluded_match_kinds: [comment, doccomment]
    message: 'An SF Symbol''s name: use its meaning from AppIcon (PRKitDesign/AppIcon.swift), DESIGN.md.'
    severity: error
