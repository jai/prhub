name: PRHub

# PRKit, the PR screens, from this repo's root package (Package.swift).
packages:
  PRKit:
    path: ..
  # Every request the app makes goes through it (jai/durable-networking); PRKit's Package.swift pins the same.
  DurableNetworking:
    url: https://github.com/jai/durable-networking
    from: 0.2.0
  # Usage analytics, behind app/PRHub/Analytics/PostHogAnalytics.swift only. Pinned: a new version is read first.
  PostHog:
    url: https://github.com/PostHog/posthog-ios
    exactVersion: 3.93.6

options:
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: 6.0
    SWIFT_STRICT_CONCURRENCY: complete
    # Xcode Cloud sets both versions when it builds a release tag (app/ci_scripts/ci_post_clone.sh): nobody edits them.
    CURRENT_PROJECT_VERSION: 293
    MARKETING_VERSION: 0.1.0
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: K2P9X73SPT
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"

targets:
  # PRHub: App Store Connect app 6831601628.
  # One app on two destinations, the iPhone and the Mac: the Mac's own sources are in PRHub/Mac.
  PRHub:
    type: application
    platform: auto
    supportedDestinations: [iOS, macOS]
    # PRHub's build options: the hosted Worker's host and onboarding's ways in (app/README.md).
    configFiles:
      Debug: Config/PRHub.xcconfig
      Release: Config/PRHub.xcconfig
    sources:
      - path: PRHub
        excludes:
          - "**/.DS_Store"
          - "Info.plist"
          - "PrivacyInfo.xcprivacy"
          - "PRHub.entitlements"
          - "Mac/**"
      # Named on its own so it is a bundled resource: Apple's upload scanner reads the privacy manifest from the .app root.
      - path: PRHub/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: PRHub/Mac
        destinationFilters: [macOS]
        excludes:
          - "PRHubMac.entitlements"
    # Info.plist is generated from this block by `xcodegen generate`; XcodeGen adds the CFBundle* keys.
    info:
      path: PRHub/Info.plist
      properties:
        CFBundleDisplayName: PRHub
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        LSApplicationCategoryType: public.app-category.developer-tools
        ITSAppUsesNonExemptEncryption: false
        # Setup links: prhub://setup?worker=…&code=… (docs/api.md, "The setup link").
        CFBundleURLTypes:
          - CFBundleURLName: setup
            CFBundleURLSchemes: [prhub]
          # Separate from setup: an older PRHub cannot accept and silently ignore a PR handoff.
          - CFBundleURLName: pull-request
            CFBundleURLSchemes: [prhub-pr]
        # Config/PRHub.xcconfig: the hosted Worker, and which ways in onboarding offers.
        PRHubHostedHost: $(PRHUB_HOSTED_HOST)
        PRHubSignInWithGitHub: $(PRHUB_SIGN_IN_GITHUB)
        PRHubSelfHosted: $(PRHUB_SELF_HOSTED)
        PRHubSamples: $(PRHUB_SAMPLES)
        PRHubAnalyticsKey: $(PRHUB_ANALYTICS_KEY)
        PRHubAnalyticsHost: $(PRHUB_ANALYTICS_HOST)
        # The app group the PR mirror lives in, shared with PRHubNotifications.
        PRHubAppGroup: $(PRHUB_APP_GROUP)
        NSCameraUsageDescription: PRHub uses the camera to scan the setup code your pr-worker printed.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # The pr-worker's silent wake.
        UIBackgroundModes:
          - remote-notification
    # Generated too: XcodeGen rewrites this file on every `generate`, so the keys live here. Push, for the silent wake;
    # the app's own keychain group, for the device secret and the Worker URL; the hosted Worker's host, so the sign-in
    # session may catch its HTTPS callback (`/auth/github/done`).
    entitlements:
      path: PRHub/PRHub.entitlements
      properties:
        aps-environment: development
        com.apple.developer.associated-domains:
          - webcredentials:$(PRHUB_HOSTED_HOST)
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.jaigovindani.prreview
        # The PR mirror, which PRHubNotifications fills before an alert's tap.
        com.apple.security.application-groups:
          - $(PRHUB_APP_GROUP)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jaigovindani.prreview
        PRODUCT_NAME: PRHub
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        # The Mac's entitlements are a file of its own: XcodeGen writes one entitlements file a target, the phone's.
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": PRHub/Mac/PRHubMac.entitlements
    dependencies:
      - package: PRKit
        product: PRKit
      - package: PRKit
        product: PRHubCore
      - package: PRKit
        product: FeatureKit
      - package: DurableNetworking
      - package: PostHog
        product: PostHog
      - target: PRHubNotifications
        destinationFilters: [iOS]
      - target: PRHubShare
        destinationFilters: [iOS]
    scheme:
      # One plan a layer, each picked by -testPlan (docs/workflow.md): the UI tests, parallel on Simulator clones and
      # retried once on failure by the command line that runs them; the app-hosted rendering checks, one at a time and
      # never retried. Unit and integration tests are `swift test`.
      testPlans:
        - path: PRHubUITests.xctestplan
          defaultPlan: true
        - path: PRHubRenderingTests.xctestplan
        - path: PRHubMacUITests.xctestplan
        - path: PRKitUITests.xctestplan
        - path: PRKitRenderingTests.xctestplan
        - path: PRHubE2EPairingTests.xctestplan
        - path: PRHubE2ETests.xctestplan
        - path: PRHubPerformanceTests.xctestplan

  # The Notification Service Extension: fetches an alert's PR into the app group's mirror before the tap
  # (`PRPushPrefetch`), within iOS's time for it, and shows the alert either way.
  PRHubNotifications:
    type: app-extension
    platform: iOS
    configFiles:
      Debug: Config/PRHub.xcconfig
      Release: Config/PRHub.xcconfig
    sources:
      - path: PRHubNotifications
        excludes:
          - "Info.plist"
          - "PRHubNotifications.entitlements"
      # The app's own Keychain reads, for the paired Worker's URL and the device secret.
      - path: PRHubCore/Pairing/WorkerURLStore.swift
      - path: PRHubCore/Pairing/DeviceSecretStore.swift
    info:
      path: PRHubNotifications/Info.plist
      properties:
        CFBundleDisplayName: PRHub
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        PRHubAppGroup: $(PRHUB_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    entitlements:
      path: PRHubNotifications/PRHubNotifications.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.jaigovindani.prreview
        com.apple.security.application-groups:
          - $(PRHUB_APP_GROUP)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jaigovindani.prreview.notifications
        PRODUCT_NAME: PRHubNotifications
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        APPLICATION_EXTENSION_API_ONLY: YES
    dependencies:
      - package: PRKit
        product: PRKitCore
      - package: DurableNetworking

  # The Share Extension: PRHub in the share sheet for a link. A GitHub PR link opens in the app through its
  # `prhub-pr://open` handoff (docs/api.md, "Opening a pull request in PRHub").
  PRHubShare:
    type: app-extension
    platform: iOS
    sources:
      - path: PRHubShare
        excludes:
          - "Info.plist"
      # The handoff's rules, the same as the app's.
      - path: PRHubCore/App/PRHubOpenLink.swift
    info:
      path: PRHubShare/Info.plist
      properties:
        CFBundleDisplayName: PRHub
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jaigovindani.prreview.share
        PRODUCT_NAME: PRHubShare
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        APPLICATION_EXTENSION_API_ONLY: YES
    dependencies:
      - package: PRKit
        product: PRKitCore

  # What only the running app shows, in sample mode (no Worker, no secrets): layout, gestures, the system's screens and
  # one walk through each way in. Everything a lower layer can check is checked there.
  PRHubUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - PRHubUITests
    dependencies:
      - target: PRHub
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jaigovindani.prreview.uitests
        GENERATE_INFOPLIST_FILE: YES

  # What only the Mac's windows show, which no Simulator does: the PRs window's toolbar and the windows it opens.
  # Not in CI yet (docs/workflow.md). It controls the Mac's screen, so agents do not run it by hand on Jai's Macs
  # (AGENTS.md, "Tests on Jai's Macs"). Signed to run locally, from app/, it is:
  #   xcodebuild test -project PRHub.xcodeproj -scheme PRHub -testPlan PRHubMacUITests -destination 'platform=macOS' \
  #     CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= PROVISIONING_PROFILE_SPECIFIER= CODE_SIGN_ENTITLEMENTS=
  PRHubMacUITests:
    type: bundle.ui-testing
    supportedDestinations: [macOS]
    sources:
      - PRHubMacUITests
    dependencies:
      - target: PRHub
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jaigovindani.prreview.macuitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: PRHub

  # PRKit's native interactions use PRHub only as the controlled sample host.
  PRKitUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - ../PRKit/Tests/PRKitUITests
      - PRHubUITests/UITestSupport.swift
    dependencies:
      - target: PRHub
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jaigovindani.prkit.uitests
        GENERATE_INFOPLIST_FILE: YES

  # Library rendering owns its direct PRKit fixtures; PRHub supplies the iOS window scene only.
  PRKitRenderingTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ../PRKit/Tests/PRKitRenderingTests
      - ../PRKit/Tests/PRKitTestSupport/InMemoryStorage.swift
    dependencies:
      - target: PRHub
      - package: PRKit
        product: PRKit
      - package: DurableNetworking
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jaigovindani.prkit.renderingtests
        GENERATE_INFOPLIST_FILE: YES

  # App build settings and the app-owned account sheet, using the running app as host.
  PRHubRenderingTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - PRHubRenderingTests
    dependencies:
      - target: PRHub
      - package: PRKit
        product: PRKit
      - package: PRKit
        product: PRHubCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jaigovindani.prreview.renderingtests
        GENERATE_INFOPLIST_FILE: YES

  # Manual checks against a paired deployed Worker; never included in the fixed-data release UI plan.
  PRHubE2ETests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - PRHubE2ETests
      - PRHubUITests/UITestSupport.swift
    dependencies:
      - target: PRHub
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jaigovindani.prreview.e2etests
        GENERATE_INFOPLIST_FILE: YES

  PRHubPerformanceTests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - PRHubPerformanceTests
      - PRHubUITests/UITestSupport.swift
      - ../PRKit/Tests/PRKitUITests/PRKitFoldTestSupport.swift
    dependencies:
      - target: PRHub
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jaigovindani.prreview.performancetests
        GENERATE_INFOPLIST_FILE: YES
