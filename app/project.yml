name: PRHub

# PRKit, the PR screens, from this repo's root package (Package.swift).
packages:
  PRKit:
    path: ..
  # Usage analytics, behind app/PRHub/Analytics/PostHogAnalytics.swift only. Pinned: a new version is read first.
  PostHog:
    url: https://github.com/PostHog/posthog-ios
    exactVersion: 3.93.6

options:
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: 6.0
    SWIFT_STRICT_CONCURRENCY: complete
    # Only a `chore(release): PRHub build N — …` commit changes this number (AGENTS.md, "Releases"): a change to this
    # file on main starts Xcode Cloud's release build, which sets it to Xcode Cloud's own number.
    CURRENT_PROJECT_VERSION: 270
    MARKETING_VERSION: 0.1.0
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: K2P9X73SPT
    IPHONEOS_DEPLOYMENT_TARGET: "26.0"

targets:
  # PRHub: App Store Connect app 6831601628.
  # One app on two destinations, the iPhone and the Mac: the Mac's own sources are in PRHub/Mac.
  PRHub:
    type: application
    platform: auto
    supportedDestinations: [iOS, macOS]
    # PRHub's build options: the hosted Worker's host and onboarding's ways in (app/README.md).
    configFiles:
      Debug: Config/PRHub.xcconfig
      Release: Config/PRHub.xcconfig
    sources:
      - path: PRHub
        excludes:
          - "**/.DS_Store"
          - "Info.plist"
          - "PrivacyInfo.xcprivacy"
          - "PRHub.entitlements"
          - "Mac/**"
      # Named on its own so it is a bundled resource: Apple's upload scanner reads the privacy manifest from the .app root.
      - path: PRHub/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: PRHub/Mac
        destinationFilters: [macOS]
        excludes:
          - "PRHubMac.entitlements"
    # Info.plist is generated from this block by `xcodegen generate`; XcodeGen adds the CFBundle* keys.
    info:
      path: PRHub/Info.plist
      properties:
        CFBundleDisplayName: PRHub
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        LSApplicationCategoryType: public.app-category.developer-tools
        ITSAppUsesNonExemptEncryption: false
        # Setup links: prhub://setup?worker=…&code=… (docs/api.md, "The setup link").
        CFBundleURLTypes:
          - CFBundleURLName: setup
            CFBundleURLSchemes: [prhub]
        # Config/PRHub.xcconfig: the hosted Worker, and which ways in onboarding offers.
        PRHubHostedHost: $(PRHUB_HOSTED_HOST)
        PRHubSignInWithGitHub: $(PRHUB_SIGN_IN_GITHUB)
        PRHubSelfHosted: $(PRHUB_SELF_HOSTED)
        PRHubSamples: $(PRHUB_SAMPLES)
        PRHubAnalyticsKey: $(PRHUB_ANALYTICS_KEY)
        PRHubAnalyticsHost: $(PRHUB_ANALYTICS_HOST)
        # The app group the PR mirror lives in, shared with PRHubNotifications.
        PRHubAppGroup: $(PRHUB_APP_GROUP)
        NSCameraUsageDescription: PRHub uses the camera to scan the setup code your pr-worker printed.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # The pr-worker's silent wake, through the relay.
        UIBackgroundModes:
          - remote-notification
    # Generated too: XcodeGen rewrites this file on every `generate`, so the keys live here. Push, for the silent wake;
    # the app's own keychain group, for the device secret and the Worker URL; the hosted Worker's host, so the sign-in
    # session may catch its HTTPS callback (`/auth/github/done`).
    entitlements:
      path: PRHub/PRHub.entitlements
      properties:
        aps-environment: development
        com.apple.developer.associated-domains:
          - webcredentials:$(PRHUB_HOSTED_HOST)
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.jaigovindani.prreview
        # The PR mirror, which PRHubNotifications fills before an alert's tap.
        com.apple.security.application-groups:
          - $(PRHUB_APP_GROUP)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jaigovindani.prreview
        PRODUCT_NAME: PRHub
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        # The Mac's entitlements are a file of its own: XcodeGen writes one entitlements file a target, the phone's.
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": PRHub/Mac/PRHubMac.entitlements
    dependencies:
      - package: PRKit
        product: PRKit
      - package: PRKit
        product: FeatureKit
      - package: PostHog
        product: PostHog
      - target: PRHubNotifications
        destinationFilters: [iOS]
    scheme:
      testTargets:
        - PRHubTests
        - PRHubUITests
        # The PR screens' own tests, run with the app's.
        - package: PRKit/PRKitTests
      gatherCoverageData: true
      # Every test by default; Xcode Cloud's PRHub Tests runs ui-1 to ui-4 side by side (scripts/ui-test-slices.py).
      testPlans:
        - path: TestPlans/all.xctestplan
          defaultPlan: true
        - path: TestPlans/ui-1.xctestplan
        - path: TestPlans/ui-2.xctestplan
        - path: TestPlans/ui-3.xctestplan
        - path: TestPlans/ui-4.xctestplan

  # The Notification Service Extension: fetches an alert's PR into the app group's mirror before the tap
  # (`PRPushPrefetch`), within iOS's time for it, and shows the alert either way.
  PRHubNotifications:
    type: app-extension
    platform: iOS
    configFiles:
      Debug: Config/PRHub.xcconfig
      Release: Config/PRHub.xcconfig
    sources:
      - path: PRHubNotifications
        excludes:
          - "Info.plist"
          - "PRHubNotifications.entitlements"
      # The app's own Keychain reads, for the paired Worker's URL and the device secret.
      - path: PRHub/Pairing/WorkerURLStore.swift
      - path: PRHub/Pairing/DeviceSecretStore.swift
    info:
      path: PRHubNotifications/Info.plist
      properties:
        CFBundleDisplayName: PRHub
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        PRHubAppGroup: $(PRHUB_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    entitlements:
      path: PRHubNotifications/PRHubNotifications.entitlements
      properties:
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.jaigovindani.prreview
        com.apple.security.application-groups:
          - $(PRHUB_APP_GROUP)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jaigovindani.prreview.notifications
        PRODUCT_NAME: PRHubNotifications
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        APPLICATION_EXTENSION_API_ONLY: YES
    dependencies:
      - package: PRKit
        product: PRKitCore

  PRHubTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - PRHubTests
      # The worker's fixtures these tests read, in the bundle: Xcode Cloud's test Mac has no sources.
      - path: ../docs/fixtures/device-config.json
        buildPhase: resources
      - path: ../docs/fixtures/device-config-hosted.json
        buildPhase: resources
    dependencies:
      - target: PRHub
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jaigovindani.prreview.tests
        GENERATE_INFOPLIST_FILE: YES

  # The app in sample mode: onboarding, the lists, a PR, its diff and key lines, Settings. No Worker, no secrets.
  PRHubUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - PRHubUITests
    dependencies:
      - target: PRHub
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jaigovindani.prreview.uitests
        GENERATE_INFOPLIST_FILE: YES
        # FastWaits.swift: XCTest's waits for an element look at once, then every 0.1 s, not once a second.
        INFOPLIST_KEY_NSPrincipalClass: $(PRODUCT_MODULE_NAME).FastWaits
