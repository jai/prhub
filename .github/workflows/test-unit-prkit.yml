# test-unit-prkit (make test-unit-prkit): swift test on PRKitUnitTests, on a Mac. On each push to main that changes
# PRKit, and in each ios and prkit release (release.yml).
# Prepare: the checkout. Test: make test-unit-prkit. Clean up: GitHub discards the VM after the job.
name: test-unit-prkit

on:
  push:
    branches: [main]
    paths: ["PRKit/**", "Package.swift", "Package.resolved", "Makefile", ".github/workflows/test-unit-prkit.yml"]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: check-test-unit-prkit-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

jobs:
  test-unit-prkit:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - run: make test-unit-prkit
