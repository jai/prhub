# PRKit's unit tests (make test-unit-prkit): swift test on PRKitUnitTests. On each push that changes PRKit, and in each ios and prkit release.
name: test-unit-prkit

on:
  push:
    branches: [main]
    paths: ["PRKit/**", "Package.swift", "Package.resolved", ".swiftlint.yml", ".swiftformat", "Makefile", ".github/workflows/test-unit-prkit.yml"]
  workflow_call:

permissions:
  contents: read

jobs:
  test-unit-prkit:
    runs-on: [self-hosted, zoomies, mac]
    timeout-minutes: 10
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v5
        with:
          cache: false
      - run: make test-unit-prkit
      - name: Remove disposable products
        if: always()
        run: rm -rf -- .build app/build app/*.xcodeproj worker/node_modules worker/.wrangler agent/node_modules
