# End to end against the deployed test Worker and the shared relay: nightly and by hand, never a pull request's check.
# Secrets live in the protected `e2e` environment: PRHUB_E2E_WORKER_URL (the test Worker, prhub-test),
# PRHUB_E2E_DEVICE_TOKEN (a device secret paired there with `npm run pair -- --app ci-e2e`) and PRHUB_E2E_RELAY_KEY (a
# relay key issued for this check, label prhub-e2e). Pairing prhub-test without --app (a phone or simulator as its one
# device) unpairs every app, this one too: the worker job then fails with 401 until ci-e2e is paired again.
# The test Worker reads real PRs and this repo's logs are public: steps print counts and statuses, never a body.
name: e2e

on:
  schedule:
    - cron: "17 20 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e
  cancel-in-progress: false

env:
  RELAY_URL: https://agent-pager-relay.jai-f89.workers.dev

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: e2e
    env:
      URL: ${{ secrets.PRHUB_E2E_WORKER_URL }}
      SECRET: ${{ secrets.PRHUB_E2E_DEVICE_TOKEN }}
    steps:
      - name: The device config
        run: |
          get() { printf 'header = "Authorization: Bearer %s"\n' "$SECRET" | curl -sS --fail --retry 2 --config - "$URL$1"; }
          get /device/config | jq -e '.login | type == "string" and length > 0' > /dev/null
          echo "config: $(get /device/config | jq -c '{login, features}')"
      - name: List PRs, then read one's detail and diff
        run: |
          get() { printf 'header = "Authorization: Bearer %s"\n' "$SECRET" | curl -sS --fail --retry 2 --config - "$URL$1"; }
          prs=$(get /prs)
          echo "$prs" | jq -e '.synced_at > 0 and (.prs | type == "array")' > /dev/null
          echo "rows: $(echo "$prs" | jq '.prs | length')"
          pr=$(echo "$prs" | jq -r '.prs[0] | select(. != null) | "\(.repo)/\(.number)"')
          if [ -z "$pr" ]; then
            echo "::warning::the test Worker lists no PRs; detail and diff not checked"
            exit 0
          fi
          get "/prs/$pr/detail" | jq -e '.merge and .review' > /dev/null
          code=$(printf 'header = "Authorization: Bearer %s"\n' "$SECRET" | curl -sS --config - -o diff.out -w '%{http_code}' "$URL/prs/$pr/diff")
          echo "diff: HTTP $code, $(wc -c < diff.out) bytes"
          test "$code" = 200
          test -s diff.out
      - name: The repo index and a PR summary
        run: |
          get() { printf 'header = "Authorization: Bearer %s"\n' "$SECRET" | curl -sS --fail --retry 2 --config - "$URL$1"; }
          repos=$(get /repos)
          echo "$repos" | jq -e '(.repos | length) > 0 and (.owners | type == "array")' > /dev/null
          echo "repos: $(echo "$repos" | jq '.repos | length')"
          repo=$(echo "$repos" | jq -r '[.repos[] | select(.openPrs > 0)][0].nameWithOwner // empty')
          [ -n "$repo" ] || { echo "::warning::no repo with an open PR; summary not checked"; exit 0; }
          prs=$(get /prs)
          number=$(echo "$prs" | jq -r --arg repo "$repo" '[.prs[] | select(.repo == $repo)][0].number // empty')
          [ -n "$number" ] || number=1
          get "/prs/$repo/$number/summary" | jq -e '.repo and .number and .state' > /dev/null \
            || { code=$(printf 'header = "Authorization: Bearer %s"\n' "$SECRET" | curl -s --config - -o /dev/null -w '%{http_code}' "$URL/prs/$repo/$number/summary"); test "$code" = 404; }
      - name: No unauthenticated read
        run: test "$(curl -s -o /dev/null -w '%{http_code}' "$URL/prs")" = 401

  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: e2e
    steps:
      - name: A push to a made-up device comes back as Apple's BadDeviceToken
        env:
          KEY: ${{ secrets.PRHUB_E2E_RELAY_KEY }}
        run: |
          body='{"device_token":"'"$(printf '0%.0s' $(seq 64))"'","apns_env":"sandbox","push_type":"background","priority":5,"payload":{"aps":{"content-available":1},"reason":"pr_sync"}}'
          answer=$(printf 'header = "Authorization: Bearer %s"\n' "$KEY" | curl -sS --fail --config - -H 'content-type: application/json' -d "$body" "$RELAY_URL/v1/push")
          echo "relay: $answer"
          echo "$answer" | jq -e '.apns_status == 400 and .reason == "BadDeviceToken"' > /dev/null
      - name: A wrong key is refused
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Authorization: Bearer rks_wrong' -H 'content-type: application/json' -d '{}' "$RELAY_URL/v1/push")" = 401

  # The Feedback tab against FeedbackKit's live Worker as its test app (#51), on the iPhone, on FeedbackKit's direct
  # path (#53): a message goes from the tab and the runner's echo comes back once it has delivered it, and a sent
  # screenshot shows in its message and opens. The test app's chats are deleted before and after.
  # Repo secrets: FEEDBACKKIT_E2E_URL (the Worker's root) and FEEDBACKKIT_E2E_APP_KEY (the test app's key).
  feedback-ui:
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      FEEDBACKKIT_E2E_URL: ${{ secrets.FEEDBACKKIT_E2E_URL }}
      FEEDBACKKIT_E2E_APP_KEY: ${{ secrets.FEEDBACKKIT_E2E_APP_KEY }}
    steps:
      - name: Xcode 27.2
        run: sudo xcode-select -s /Applications/Xcode_27.2.app
      - name: Boot the Simulator
        run: |
          udid=$(xcrun simctl list devices -j | jq -r '.devices | to_entries[]
            | select(.key | endswith("iOS-27-2")) | .value[] | select(.name == "iPhone 17" and .isAvailable) | .udid' | head -1)
          [ -n "$udid" ] || { echo "no iPhone 17 on iOS 27.2"; exit 1; }
          xcrun simctl boot "$udid"
          echo "SIMULATOR=$udid" >> "$GITHUB_ENV"
      - uses: actions/checkout@v5
      - name: Generate the project
        working-directory: app
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install --quiet xcodegen
          xcodegen generate --spec project.yml --quiet
          mkdir -p PRHub.xcodeproj/project.xcworkspace/xcshareddata/swiftpm
          cp Package.resolved PRHub.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
      - name: Build the app and its tests
        working-directory: app
        run: |
          set -o pipefail
          xcodebuild build-for-testing -project PRHub.xcodeproj -scheme PRHub \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/DerivedData \
            -enableCodeCoverage NO -skipPackagePluginValidation -skipMacroValidation \
            | grep -E --line-buffered "error:|\*\* (TEST )?BUILD|: (error|failed)" || true
          ls build/DerivedData/Build/Products/*.xctestrun
      - name: Delete test chats left by an earlier run
        run: scripts/feedbackkit-e2e.sh clean
      # A real screenshot from this Simulator, sent with a chat's first message, for the screenshot test (#53).
      - name: Send a chat with a screenshot
        run: |
          xcrun simctl io "$SIMULATOR" screenshot --type=jpeg "$RUNNER_TEMP/seed.jpg"
          text="End-to-end screenshot $GITHUB_RUN_ID"
          scripts/feedbackkit-e2e.sh seed-screenshot "$text" "$RUNNER_TEMP/seed.jpg"
          echo "SCREENSHOT_TEXT=$text" >> "$GITHUB_ENV"
      - name: The Feedback end-to-end test
        working-directory: app
        run: |
          set -o pipefail
          token=$(../scripts/feedbackkit-e2e.sh token)
          echo "::add-mask::$token"
          # Not skipped here: a skip would pass without checking anything.
          TEST_RUNNER_FEEDBACKKIT_E2E_URL="$FEEDBACKKIT_E2E_URL" TEST_RUNNER_FEEDBACKKIT_E2E_TOKEN="$token" \
          TEST_RUNNER_FEEDBACKKIT_E2E_SCREENSHOT_TEXT="$SCREENSHOT_TEXT" \
            xcodebuild test-without-building -xctestrun build/DerivedData/Build/Products/*.xctestrun \
            -destination "id=$SIMULATOR" -resultBundlePath build/PRHub.xcresult \
            -only-testing:PRHubUITests/PRHubFeedbackE2ETests \
            | grep -E --line-buffered "^Test (Suite|Case)|^\s+(Executed|✔|✘)|\*\* TEST|: (error|failed)" || true
          xcrun xcresulttool get test-results summary --path build/PRHub.xcresult --compact > build/summary.json
          jq -r '"\(.result): \(.passedTests) passed, \(.failedTests) failed, \(.skippedTests) skipped"' build/summary.json \
            | tee -a "$GITHUB_STEP_SUMMARY"
          jq -e '.failedTests == 0 and .skippedTests == 0 and .passedTests == 2' build/summary.json > /dev/null
      - name: Delete this run's test chats
        if: always()
        run: scripts/feedbackkit-e2e.sh clean
      - name: Zip the result bundle
        if: always()
        working-directory: app/build
        run: "[ -d PRHub.xcresult ] && zip -qry PRHub.xcresult.zip PRHub.xcresult || true"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: xcresult-feedback-e2e
          path: app/build/PRHub.xcresult.zip
          retention-days: 7
          if-no-files-found: ignore
