# test-integration-prkit (make test-integration-prkit): swift test on PRKitIntegrationTests, PRKit's persistence,
# contract fixtures, fonts and AppKit rendering, on a Mac. On each push to main that changes PRKit, and in each ios and
# prkit release (release.yml).
# Prepare: the checkout. Test: make test-integration-prkit. Clean up: GitHub discards the VM after the job.
name: test-integration-prkit

on:
  push:
    branches: [main]
    paths: ["PRKit/**", "Package.swift", "Package.resolved", "Makefile", ".github/workflows/test-integration-prkit.yml"]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: check-test-integration-prkit-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

jobs:
  test-integration-prkit:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - run: make test-integration-prkit
