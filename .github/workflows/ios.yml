# PRKit and the PRHub app's design checks, on GitHub's own runners (free for a public repo). The tests run in Xcode
# Cloud's PRHub Tests: PRKit's swift test, and the app's unit and UI tests in four test plans side by side, each on
# the iPhone 17 and the 13-inch iPad Pro (app/TestPlans, scripts/ui-test-slices.py). About 12 minutes a run there,
# where GitHub's Macs took 43 on the iPhone and 70 on the iPad (runs 43550577545 and Xcode Cloud 274, 2026-11-14).
name: ios

on:
  pull_request:
    paths: [Package.swift, PRKit/**, app/**, DESIGN.md, docs/fixtures/**, scripts/design-lint*, .github/workflows/ios.yml]
  push:
    branches: [main]
    paths: [Package.swift, PRKit/**, app/**, DESIGN.md, docs/fixtures/**, scripts/design-lint*, .github/workflows/ios.yml]
  # By hand, `only` runs one test class or test on both devices on GitHub's Macs, for a quick look at a screen:
  #   gh workflow run ios.yml -f only=PRHubUITests/PRHubScreenshotTests
  workflow_dispatch:
    inputs:
      only:
        description: "One test to run, as xcodebuild's -only-testing takes it (target/class/test). Empty: every test."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}-${{ inputs.only || 'all' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  design:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Design tokens match DESIGN.md
        run: make -C app design-check
      - name: No literal fonts, colours, paddings, corners or animations in views
        run: scripts/design-lint.sh
      - name: Xcode Cloud's test plans hold every UI test, in the slices of app/PRHubUITests/times.txt
        run: scripts/ui-test-slices.py plans --check


  # By hand only, with `only`: one test on both devices on GitHub's Macs, for a quick look at a screen and its
  # pictures (the result bundle is kept a week). Every other test run is Xcode Cloud's.
  one:
    if: ${{ inputs.only != '' }}
    name: one (${{ matrix.device }})
    runs-on: xcode-27
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        device: ["iPhone 17", "iPad Pro 13-inch (M5)"]
    steps:
      - uses: actions/checkout@v5
      - name: Xcode 27.2
        run: sudo xcode-select -s /Applications/Xcode_27.2.app
      - name: Generate the project
        working-directory: app
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install --quiet xcodegen
          xcodegen generate --spec project.yml --quiet
          mkdir -p PRHub.xcodeproj/project.xcworkspace/xcshareddata/swiftpm
          cp Package.resolved PRHub.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
      - name: The test
        working-directory: app
        env:
          ONLY: ${{ inputs.only }}
        run: |
          set -o pipefail
          xcodebuild test -project PRHub.xcodeproj -scheme PRHub \
            -destination 'platform=iOS Simulator,name=${{ matrix.device }},OS=27.2' \
            -derivedDataPath build/DerivedData -resultBundlePath build/PRHub.xcresult -enableCodeCoverage NO \
            -skipPackagePluginValidation -skipMacroValidation "-only-testing:$ONLY" \
            | grep -E --line-buffered "^Test (Suite|Case|session)|^\s+(Executed|✔|✘)|error:|\*\* TEST|: (error|failed)" || true
          xcrun xcresulttool get test-results summary --path build/PRHub.xcresult --compact > build/summary.json
          jq -r '"\(.result): \(.passedTests) passed, \(.failedTests) failed", (.testFailures[]? | "FAILED \(.testIdentifierString): \(.failureText)")' build/summary.json | tee -a "$GITHUB_STEP_SUMMARY"
          jq -e '.failedTests == 0 and .passedTests > 0' build/summary.json > /dev/null
      - name: Zip the result bundle
        if: always()
        working-directory: app/build
        run: "[ -d PRHub.xcresult ] && zip -qry PRHub.xcresult.zip PRHub.xcresult || true"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: xcresult-${{ matrix.device }}
          path: app/build/PRHub.xcresult.zip
          retention-days: 7
          if-no-files-found: ignore
