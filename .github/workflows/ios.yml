# PRKit and the PRHub app on GitHub's macOS runners: PRKit's tests on macOS; the app built once for the Simulator; then
# side by side, the app's and PRKit's unit tests on an iPhone and the UI tests on an iPhone and on a 13-inch iPad, each
# device's in three slices (app/PRHubUITests/shards.txt), in sample mode, with no secrets. The repo is public, so its
# macOS minutes are free: the slices only cost runners, not money. The UI tests' pictures of every screen (light, dark
# and large text) are uploaded as an artifact per device and slice.
name: ios

on:
  pull_request:
    paths: [Package.swift, PRKit/**, app/**, DESIGN.md, docs/fixtures/**, scripts/design-lint*, .github/workflows/ios.yml]
  push:
    branches: [main]
    paths: [Package.swift, PRKit/**, app/**, DESIGN.md, docs/fixtures/**, scripts/design-lint*, .github/workflows/ios.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  design:
    runs-on: ubicloud-standard-2
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Design tokens match DESIGN.md
        run: make -C app design-check
      - name: No literal fonts, colours, paddings, corners or animations in views
        run: scripts/design-lint.sh
      - name: Every UI test is in one CI slice
        run: scripts/ui-test-shards.sh check

  prkit:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)" && xcodebuild -version
      - name: swift test
        run: swift test

  # One build for every slice: a Simulator build runs on the iPhone and the iPad alike.
  build:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Xcode and XcodeGen
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          xcodebuild -version
          brew install xcodegen
      - name: Build for testing
        working-directory: app
        run: |
          xcodegen generate --spec project.yml --quiet
          xcodebuild build-for-testing -project PRHub.xcodeproj -scheme PRHub \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/DerivedData -quiet
      # A tarball, because an artifact loses the files' modes and the app could not launch.
      - name: Products
        working-directory: app/build/DerivedData/Build
        run: tar -czf "$RUNNER_TEMP/products.tgz" Products
      - uses: actions/upload-artifact@v4
        with:
          name: products
          path: ${{ runner.temp }}/products.tgz
          retention-days: 1

  app:
    name: app (${{ matrix.device }}, ${{ matrix.slice }})
    needs: build
    runs-on: macos-26
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        device: [iPhone, iPad]
        slice: ["1", "2", "3"]
        include:
          # The newest numbered iPhone.
          - device: iPhone
            pattern: "^iPhone [0-9]+$"
          # The 13-inch iPad Pro: the regular width, with the list beside the PR.
          - device: iPad
            pattern: '^iPad Pro 13-inch \(M[0-9]+\)$'
          # The unit tests, once: they draw no screen.
          - device: iPhone
            slice: unit
            pattern: "^iPhone [0-9]+$"
    steps:
      - uses: actions/checkout@v5
      - name: Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)" && xcodebuild -version
      - uses: actions/download-artifact@v4
        with:
          name: products
          path: ${{ runner.temp }}
      - name: Products
        run: mkdir -p app/build && tar -xzf "$RUNNER_TEMP/products.tgz" -C app/build
      - name: Simulator
        env:
          FAMILY: ${{ matrix.device }}
          PATTERN: ${{ matrix.pattern }}
        run: |
          # The newest iOS runtime, and the newest device of the matrix's kind it supports.
          json=$(xcrun simctl list runtimes -j)
          runtime=$(jq -r '[.runtimes[] | select(.platform == "iOS" and .isAvailable)] | last | .identifier' <<<"$json")
          type=$(jq -r --arg r "$runtime" --arg family "$FAMILY" --arg pattern "$PATTERN" '.runtimes[]
            | select(.identifier == $r) | [.supportedDeviceTypes[]
            | select(.productFamily == $family and (.name | test($pattern)))] | max_by(.name) | .identifier' <<<"$json")
          [[ -n $type && $type != null ]] || { echo "no $FAMILY matching $PATTERN on $runtime"; exit 1; }
          echo "runtime $runtime, device $type"
          echo "SIM=$(xcrun simctl create ci "$type" "$runtime")" >> "$GITHUB_ENV"
      - name: Tests
        working-directory: app
        env:
          SLICE: ${{ matrix.slice }}
          TEST_RUNNER_SCREENSHOTS_DIR: ${{ github.workspace }}/app/build/screenshots
        run: |
          if [ "$SLICE" = unit ]; then
            tests=(-only-testing:PRHubTests -only-testing:PRKitTests)
          else
            mapfile -t tests < <(../scripts/ui-test-shards.sh args "$SLICE")
          fi
          testrun=(build/Products/*.xctestrun)
          # Two Simulator clones share a slice's classes.
          xcodebuild test-without-building -xctestrun "${testrun[0]}" \
            -destination "id=$SIM" -parallel-testing-enabled YES -parallel-testing-worker-count 2 \
            -resultBundlePath build/tests.xcresult "${tests[@]}"
      - name: Screenshots
        if: always() && matrix.slice != 'unit'
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ matrix.device }}-${{ matrix.slice }}
          path: app/build/screenshots
          if-no-files-found: warn
      - name: Results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcresults-${{ matrix.device }}-${{ matrix.slice }}
          path: app/build/*.xcresult
