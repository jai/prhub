# The design checks for PRKit and the PRHub app, on GitHub's own Linux runners (free for a public repo). The tests run in Xcode Cloud's "PRHub Tests" workflow
# (app/ci_scripts): PRKit's `swift test` on its build Mac, then the PRHub scheme's unit and UI tests on an iPhone and on
# a 13-inch iPad Pro.
name: ios

on:
  pull_request:
    paths: [Package.swift, PRKit/**, app/**, DESIGN.md, docs/fixtures/**, scripts/design-lint*, .github/workflows/ios.yml]
  push:
    branches: [main]
    paths: [Package.swift, PRKit/**, app/**, DESIGN.md, docs/fixtures/**, scripts/design-lint*, .github/workflows/ios.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  design:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Design tokens match DESIGN.md
        run: make -C app design-check
      - name: No literal fonts, colours, paddings, corners or animations in views
        run: scripts/design-lint.sh
