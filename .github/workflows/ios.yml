# PRKit and the PRHub app, on GitHub's own runners (free for a public repo): the design checks on Linux, and the tests
# on Macs with Xcode 27.2 (the `xcode-27` image): PRKit's `swift test`, then the PRHub scheme's unit and UI tests on an
# iPhone and on a 13-inch iPad Pro, each device a job of its own. Each test job keeps its result bundle (pictures, UI
# trees, logs) as an artifact for a week. Xcode Cloud ran these until 14 November 2026; it still makes the builds.
name: ios

on:
  pull_request:
    paths: [Package.swift, PRKit/**, app/**, DESIGN.md, docs/fixtures/**, scripts/design-lint*, .github/workflows/ios.yml]
  push:
    branches: [main]
    paths: [Package.swift, PRKit/**, app/**, DESIGN.md, docs/fixtures/**, scripts/design-lint*, .github/workflows/ios.yml]
  # By hand, `only` runs one test class or test on both devices in a run of its own, for a quick look at a screen:
  #   gh workflow run ios.yml -f only=PRHubUITests/PRHubScreenshotTests
  workflow_dispatch:
    inputs:
      only:
        description: "One test to run, as xcodebuild's -only-testing takes it (target/class/test). Empty: every test."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}-${{ inputs.only || 'all' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  design:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Design tokens match DESIGN.md
        run: make -C app design-check
      - name: No literal fonts, colours, paddings, corners or animations in views
        run: scripts/design-lint.sh

  prkit:
    if: ${{ !inputs.only }}
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Xcode 27.2
        run: sudo xcode-select -s /Applications/Xcode_27.2.app
      - name: PRKit's own tests, on the Mac
        run: swift test

  test:
    name: test (${{ matrix.device }})
    runs-on: xcode-27
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        device: ["iPhone 17", "iPad Pro 13-inch (M5)"]
    steps:
      - uses: actions/checkout@v5
      - name: Xcode 27.2
        run: sudo xcode-select -s /Applications/Xcode_27.2.app
      - name: Generate the project
        working-directory: app
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install --quiet xcodegen
          xcodegen generate --spec project.yml --quiet
          mkdir -p PRHub.xcodeproj/project.xcworkspace/xcshareddata/swiftpm
          cp Package.resolved PRHub.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
      - name: The PRHub scheme's unit and UI tests
        working-directory: app
        env:
          ONLY: ${{ inputs.only }}
        run: |
          set -o pipefail
          xcodebuild test -project PRHub.xcodeproj -scheme PRHub \
            -destination 'platform=iOS Simulator,name=${{ matrix.device }},OS=27.2' \
            -derivedDataPath build/DerivedData -resultBundlePath build/PRHub.xcresult \
            -skipPackagePluginValidation -skipMacroValidation ${ONLY:+"-only-testing:$ONLY"} \
            | grep -E --line-buffered "^Test (Suite|Case|session)|^\s+(Executed|✔|✘)|error:|\*\* TEST|Testing (failed|started)|: (error|failed)" || true
          xcrun xcresulttool get test-results summary --path build/PRHub.xcresult --compact > build/summary.json
          jq -r '"\(.result): \(.passedTests) passed, \(.failedTests) failed, \(.skippedTests) skipped", (.testFailures[]? | "FAILED \(.testIdentifierString): \(.failureText)")' build/summary.json | tee -a "$GITHUB_STEP_SUMMARY"
          jq -e '.failedTests == 0 and .passedTests > 0' build/summary.json > /dev/null
      - name: Zip the result bundle
        if: always()
        working-directory: app/build
        run: "[ -d PRHub.xcresult ] && zip -qry PRHub.xcresult.zip PRHub.xcresult || true"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: xcresult-${{ matrix.device }}
          path: app/build/PRHub.xcresult.zip
          retention-days: 7
          if-no-files-found: ignore
