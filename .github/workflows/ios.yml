# PRKit and the PRHub app, on GitHub's own runners (free for a public repo): the design checks on Linux, and the tests
# on Macs with Xcode 27.2 (the `xcode-27` image). `build` builds the app and its tests once and runs PRKit's swift
# test; then the unit and UI tests run from that build in five slices side by side, two on the iPhone and three on the
# iPad (scripts/ui-test-slices.py, by each test's seconds in app/PRHubUITests/times.txt): GitHub runs five Mac jobs at
# a time for the account. A push or a pull request runs only the fast checks, `design` and `build` (a newer push cancels
# the older run); the five slices run once an hour from hourly-release.yml, on the commit it is about to release, and
# by hand. Xcode Cloud ran the tests until 14 November 2026 and ran out of hours; it makes the builds. Each test job
# keeps its result bundle (pictures, UI trees, logs) as an artifact for a week.
name: ios

on:
  pull_request:
    paths: [Package.swift, PRKit/**, app/**, DESIGN.md, docs/fixtures/**, scripts/design-lint*, .github/workflows/ios.yml]
  push:
    branches: [main]
    paths: [Package.swift, PRKit/**, app/**, DESIGN.md, docs/fixtures/**, scripts/design-lint*, .github/workflows/ios.yml]
  # By hand, `only` runs one test class or test on both devices in a run of its own, for a quick look at a screen:
  #   gh workflow run ios.yml -f only=PRHubUITests/PRHubScreenshotTests/testListRefreshingUnderItsBannerInEveryLook
  workflow_dispatch:
    inputs:
      only:
        description: "One test to run, as xcodebuild's -only-testing takes it (target/class/test). Empty: every test."
        required: false
        default: ""
  # The hourly release's full test run, on the commit it releases.
  workflow_call:
    inputs:
      ref:
        description: "The commit to test."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # The caller's name in a hourly run, so a push to main never cancels the release's tests.
  group: ios-${{ github.workflow }}-${{ github.ref }}-${{ inputs.only || 'all' }}
  cancel-in-progress: true

jobs:
  design:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Design tokens match DESIGN.md
        run: make -C app design-check
      - name: No literal fonts, colours, paddings, corners or animations in views
        run: scripts/design-lint.sh

  # One build for every slice: a Simulator build runs on the iPhone and the iPad alike. No code coverage: nobody reads
  # it, and a build that gathers it is slower to make, to launch and to quit.
  build:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Xcode 27.2
        run: sudo xcode-select -s /Applications/Xcode_27.2.app
      - name: Generate the project
        working-directory: app
        run: |
          HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_INSTALL_CLEANUP=1 brew install --quiet xcodegen
          xcodegen generate --spec project.yml --quiet
          mkdir -p PRHub.xcodeproj/project.xcworkspace/xcshareddata/swiftpm
          cp Package.resolved PRHub.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
      - name: Build the app and its tests
        working-directory: app
        run: |
          set -o pipefail
          xcodebuild build-for-testing -project PRHub.xcodeproj -scheme PRHub \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/DerivedData \
            -enableCodeCoverage NO -skipPackagePluginValidation -skipMacroValidation \
            | grep -E --line-buffered "error:|warning: unre|\*\* (TEST )?BUILD|: (error|failed)" || true
          ls build/DerivedData/Build/Products/*.xctestrun
          # A tarball: an artifact drops the files' modes, and the app then cannot launch.
          tar -czf "$RUNNER_TEMP/products.tgz" -C build/DerivedData/Build Products
          du -h "$RUNNER_TEMP/products.tgz"
      # PRKit's own tests here, while the slices start: a job of its own took a sixth Mac.
      - name: PRKit's own tests, on the Mac
        if: ${{ !inputs.only }}
        run: swift test
      - uses: actions/upload-artifact@v5
        if: github.event_name != 'push' && github.event_name != 'pull_request'
        with:
          name: products
          path: ${{ runner.temp }}/products.tgz
          retention-days: 1

  # Not on a push or a pull request: the hourly release runs them before it releases, and anyone can by hand.
  test:
    name: test (${{ matrix.device }}, ${{ matrix.slice }} of ${{ matrix.of }})
    needs: build
    if: github.event_name != 'push' && github.event_name != 'pull_request'
    runs-on: xcode-27
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Two slices on the iPhone and three on the iPad; by hand with `only`, one job a device.
        include: >-
          ${{ fromJSON(inputs.only
          && '[{"device":"iPhone 17","slice":1,"of":1},{"device":"iPad Pro 13-inch (M5)","slice":1,"of":1}]'
          || '[{"device":"iPhone 17","slice":1,"of":2},{"device":"iPhone 17","slice":2,"of":2},{"device":"iPad Pro 13-inch (M5)","slice":1,"of":3},{"device":"iPad Pro 13-inch (M5)","slice":2,"of":3},{"device":"iPad Pro 13-inch (M5)","slice":3,"of":3}]') }}
    steps:
      - name: Xcode 27.2
        run: sudo xcode-select -s /Applications/Xcode_27.2.app
      # First, so it boots while the build comes down: a Simulator's first boot on a new Mac takes minutes.
      - name: Boot the Simulator
        env:
          DEVICE: ${{ matrix.device }}
        run: |
          udid=$(xcrun simctl list devices -j | jq -r --arg name "$DEVICE" '.devices | to_entries[]
            | select(.key | endswith("iOS-27-2")) | .value[] | select(.name == $name and .isAvailable) | .udid' | head -1)
          [ -n "$udid" ] || { echo "no $DEVICE on iOS 27.2"; exit 1; }
          xcrun simctl boot "$udid"
          echo "SIMULATOR=$udid" >> "$GITHUB_ENV"
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: actions/download-artifact@v5
        with:
          name: products
          path: ${{ runner.temp }}
      - name: The build
        run: mkdir -p app/build && tar -xzf "$RUNNER_TEMP/products.tgz" -C app/build
      - name: The PRHub scheme's unit and UI tests
        working-directory: app
        env:
          ONLY: ${{ inputs.only }}
          SLICE: ${{ matrix.slice }}
          OF: ${{ matrix.of }}
          DEVICE: ${{ matrix.device }}
        run: |
          set -o pipefail
          if [ -n "$ONLY" ]; then
            tests=("-only-testing:$ONLY")
          else
            tests=()
            while IFS= read -r test; do tests+=("$test"); done < <(../scripts/ui-test-slices.py args "$SLICE" "$OF" "$DEVICE")
            # The unit tests draw no screen: once, with the iPhone's first slice.
            if [ "$DEVICE" = "iPhone 17" ] && [ "$SLICE" = 1 ]; then
              tests+=(-only-testing:PRHubTests -only-testing:PRKitTests)
            fi
          fi
          xcodebuild test-without-building -xctestrun build/Products/*.xctestrun \
            -destination "id=$SIMULATOR" \
            -resultBundlePath build/PRHub.xcresult "${tests[@]}" \
            | grep -E --line-buffered "^Test (Suite|Case|session)|^\s+(Executed|✔|✘)|error:|\*\* TEST|Testing (failed|started)|: (error|failed)" || true
          xcrun xcresulttool get test-results summary --path build/PRHub.xcresult --compact > build/summary.json
          jq -r '"\(.result): \(.passedTests) passed, \(.failedTests) failed, \(.skippedTests) skipped", (.testFailures[]? | "FAILED \(.testIdentifierString): \(.failureText)")' build/summary.json | tee -a "$GITHUB_STEP_SUMMARY"
          jq -e '.failedTests == 0 and .passedTests > 0' build/summary.json > /dev/null
      - name: Zip the result bundle
        if: always()
        working-directory: app/build
        run: "[ -d PRHub.xcresult ] && zip -qry PRHub.xcresult.zip PRHub.xcresult || true"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: xcresult-${{ matrix.device }}-${{ matrix.slice }}
          path: app/build/PRHub.xcresult.zip
          retention-days: 7
          if-no-files-found: ignore
