# The app's UI tests (make test-ui-ios): the UI test plan on the iPhone and iPad Simulators, only in each ios release
# (release.yml). Each job keeps its test logs for a week.
name: test-ui-ios

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test-ui-ios:
    name: test-ui-ios (${{ matrix.device }})
    runs-on: xcode-27
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        device: ["iPhone 17", "iPad Pro 13-inch (M5)"]
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      - run: sudo xcode-select -s /Applications/Xcode_27.2.app
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v5
      - run: make test-ui-ios SIM_NAME="$DEVICE"
        env:
          DEVICE: ${{ matrix.device }}
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: test-ui-ios-${{ matrix.device }}
          path: app/build/DerivedData/Logs/Test
          retention-days: 7
          if-no-files-found: ignore
