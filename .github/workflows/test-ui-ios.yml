# test-ui-ios (make test-ui-ios): the app's UI layer, the app-hosted rendering plan and then the UI plan, on an iPhone
# and an iPad Simulator. Only in each ios release (release.yml), after the cheaper ios and PRKit checks pass.
# Prepare: mise (XcodeGen) and a Simulator of the job's own. Test: make test-ui-ios on it, which also generates the
# project. Keep: the result bundles, for 7 days. Clean up: delete the job's Simulator, its parallel-testing clones and its
# logs, which live outside the work folder; the ephemeral Zoomies runner deletes the work folder (the checkout,
# DerivedData, the result bundles) after the job (docs/workflow.md, "Disk use").
name: test-ui-ios

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test-ui-ios:
    name: test-ui-ios (${{ matrix.device }})
    runs-on: macos-26
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        device: ["iPhone 17", "iPad Pro 13-inch (M5)"]
    env:
      # Unique on the host: the two devices of one run can share a Mac.
      SIMULATOR_NAME: prhub-ui-${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}
    steps:
      - uses: actions/checkout@v5
      # No cache restore: the Mac keeps mise's installs between jobs.
      - uses: jdx/mise-action@v5
        with:
          cache: false
      - name: Prepare the job's Simulator
        env:
          DEVICE: ${{ matrix.device }}
        run: |
          runtime=$(xcrun simctl list runtimes -j | jq -r '[.runtimes[] | select(.isAvailable and (.name | startswith("iOS")))] | last | .identifier')
          simulator=$(xcrun simctl create "$SIMULATOR_NAME" "$DEVICE" "$runtime")
          echo "SIMULATOR=$simulator" >> "$GITHUB_ENV"
          xcrun simctl boot "$simulator"
          xcrun simctl bootstatus "$simulator" -b
      - run: make test-ui-ios SIMULATOR="$SIMULATOR"
      - name: Keep the result bundles
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: test-ui-ios-${{ matrix.device }}
          path: app/build/results
          retention-days: 3
          if-no-files-found: ignore
      - name: Delete the job's Simulator, its clones and its logs
        if: always()
        run: |
          # xcodebuild names each parallel-testing clone "Clone <n> of <Simulator name>" and deletes it at the end of a
          # run that finishes; these are the ones a cancelled run leaves.
          clones="$HOME/Library/Developer/XCTestDevices"
          if [ -d "$clones" ]; then
            xcrun simctl --set "$clones" list devices -j \
              | jq -r --arg name "$SIMULATOR_NAME" '.devices[][] | select(.name | endswith(" of " + $name)) | .udid' \
              | while read -r clone; do
                  xcrun simctl --set "$clones" shutdown "$clone" || true
                  xcrun simctl --set "$clones" delete "$clone"
                done
          fi
          if [ -n "${SIMULATOR:-}" ]; then
            xcrun simctl shutdown "$SIMULATOR" || true
            xcrun simctl delete "$SIMULATOR"
            rm -rf -- "$HOME/Library/Logs/CoreSimulator/$SIMULATOR"
          fi
