# The app's UI tests (make test-ui-ios): the UI test plan on the iPhone and iPad Simulators, only in each ios release
# (release.yml). Each job keeps its test logs for a week.
name: test-ui-ios

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test-ui-ios:
    name: test-ui-ios (${{ matrix.device }})
    runs-on: [self-hosted, zoomies, mac-desktop]
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        device: ["iPhone 17", "iPad Pro 13-inch (M5)"]
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v5
      - name: Prepare the project and owned simulator
        env:
          DEVICE: ${{ matrix.device }}
        run: |
          mise exec xcodegen@2.46.0 -- xcodegen generate --spec app/project.yml --quiet
          runtime=$(xcrun simctl list runtimes -j | jq -r '[.runtimes[] | select(.isAvailable and (.name | startswith("iOS")))] | last | .identifier')
          simulator=$(xcrun simctl create "prhub-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" "$DEVICE" "$runtime")
          echo "SIMULATOR=$simulator" >> "$GITHUB_ENV"
          xcrun simctl boot "$simulator"
          xcrun simctl bootstatus "$simulator" -b
      - name: Run the complete native UI plan
        run: make test-ui-ios SIMULATOR="$SIMULATOR"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: test-ui-ios-${{ matrix.device }}
          path: app/build/DerivedData/Logs/Test
          retention-days: 7
          if-no-files-found: ignore
      - name: Remove disposable products
        if: always()
        run: |
          if [ -n "${SIMULATOR:-}" ]; then
            xcrun simctl shutdown "$SIMULATOR" || true
            xcrun simctl delete "$SIMULATOR"
          fi
          rm -rf -- .build app/build app/*.xcodeproj worker/node_modules worker/.wrangler agent/node_modules
