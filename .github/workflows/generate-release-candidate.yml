# Generate a release candidate for each component (docs/workflow.md): ios, worker and prkit. jai/ci's release-clock
# starts it every 3 hours; anyone can start it by hand. For each component, git-cliff gets the next version from the
# conventional commits that change the component's files since its newest release tag (feat: minor, fix or perf: patch,
# a breaking change: major; nothing else releases). The RC tag is rc-<component>-v<version>-<short hash>, on the newest
# commit of main that changes the component (docs/workflow.md, Part 2). Its push starts release.yml.
name: generate-release-candidate

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: generate-release-candidate
  cancel-in-progress: false

jobs:
  candidate:
    name: candidate (${{ matrix.component }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: ios
            tag: ios-v
            paths: app PRKit Package.swift Package.resolved DESIGN.md .swiftlint.yml .swiftformat Makefile .github/workflows .gitleaks.toml cliff.toml
          - component: worker
            tag: worker-v
            paths: worker agent deploy/hosted docs/fixtures scripts/ask-trace.sh Makefile .github/workflows .gitleaks.toml cliff.toml
          - component: prkit
            tag: v
            paths: PRKit Package.swift Package.resolved .swiftlint.yml .swiftformat Makefile .github/workflows .gitleaks.toml cliff.toml
    steps:
      # The jai-agents App's token: a tag pushed with github.token starts no workflow, so release.yml would not run.
      - id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: 5757830
          private-key: ${{ secrets.JAI_AGENTS_PRIVATE_KEY }}
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - env:
          COMPONENT: ${{ matrix.component }}
          TAG: ${{ matrix.tag }}
          PATHS: ${{ matrix.paths }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          read -ra paths <<< "$PATHS"
          busy=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/runs?per_page=50" \
            --jq "[.workflow_runs[] | select(.status != \"completed\" and (.head_branch | startswith(\"rc-$COMPONENT-\")))] | length")
          if [ "$busy" != 0 ]; then
            echo "nothing cut: a $COMPONENT release is queued or running"
            exit 0
          fi
          # The newest commit that changes the component or its CI files: its release tag must be on such a commit, or
          # git-cliff's path filter does not see the tag the next time.
          git checkout -q "$(git log -1 --format=%H -- "${paths[@]}")"
          include=()
          for path in "${paths[@]}"; do
            if [ -d "$path" ]; then include+=(--include-path "$path/**"); else include+=(--include-path "$path"); fi
          done
          pattern="^${TAG}[0-9]+\.[0-9]+\.[0-9]+$"
          last=$(git tag --list "${TAG}*" --sort=-v:refname | awk -v p="$pattern" '$0 ~ p { print; exit }')
          next=$(npx --yes git-cliff@2.14.2 --bumped-version --tag-pattern "$pattern" "${include[@]}")
          if [ "$next" = "$last" ]; then
            echo "nothing cut: no feat, fix, perf or breaking change in $COMPONENT since $last"
            exit 0
          fi
          rc="rc-$COMPONENT-v${next#"$TAG"}-$(git rev-parse --short HEAD)"
          if git rev-parse -q --verify "refs/tags/$rc" > /dev/null; then
            echo "nothing cut: $rc was tested before; a fix on main makes the next one"
            exit 0
          fi
          git tag "$rc"
          git push origin "refs/tags/$rc"
          echo "release candidate $rc: $(git log -1 --format='%h %s')"
