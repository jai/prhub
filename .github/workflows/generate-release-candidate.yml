# Generate a release candidate: take the newest kits (#54), then tag main's head rc-vX.Y.Z, where vX.Y.Z is what
# git-cliff makes of the conventional commits since the newest vX.Y.Z tag (feat: minor, fix or perf: patch, a breaking
# change: major; nothing else releases). release.yml then tests that commit and releases it. One candidate at a time:
# while an rc-* tag exists, this cuts nothing; release.yml deletes it when it ends, green or red. jai/ci's
# release-clock starts it every 3 hours when main has a feat, fix, perf or breaking commit since the newest release;
# anyone can start it by hand.
name: generate release candidate

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: generate-release-candidate
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The jai-agents App's token: a tag pushed with github.token starts no workflow, so release.yml would not run.
      - id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: 5757830
          private-key: ${{ secrets.JAI_AGENTS_PRIVATE_KEY }}
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - id: open
        run: |
          open=$(git ls-remote --tags origin 'refs/tags/rc-*' | sed 's#.*refs/tags/##')
          [ -z "$open" ] || echo "nothing cut: $open is still being tested"
          echo "open=$open" >> "$GITHUB_OUTPUT"
      # Always latest (#54; Jai: never breaking, and each kit blocks API breaks in its own CI): the newest
      # AgentChatKit, FeedbackKit and DurableNetworking that Package.swift's ranges allow, in both lockfiles,
      # committed through the API (signed) as a fix(deps) commit, which this candidate carries into test-ui.
      - if: steps.open.outputs.open == ''
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.2"
      - if: steps.open.outputs.open == ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          swift package update agentchatkit feedbackkit durable-networking
          python3 - <<'PY'
          import json
          new = {p["identity"]: p["state"] for p in json.load(open("Package.resolved"))["pins"]}
          text = open("app/Package.resolved").read()
          for pin in json.loads(text)["pins"]:
              old = pin["state"]
              if new.get(pin["identity"], old) != old:
                  start = text.index('"identity" : "%s"' % pin["identity"])
                  end = text.index("}", text.index('"state"', start))
                  block = text[start:end].replace(old["revision"], new[pin["identity"]]["revision"])
                  block = block.replace('"%s"' % old["version"], '"%s"' % new[pin["identity"]]["version"])
                  text = text[:start] + block + text[end:]
          open("app/Package.resolved", "w").write(text)
          PY
          if git diff --quiet -- Package.resolved app/Package.resolved; then
            echo "the kits are the newest already"
            exit 0
          fi
          kits=$(jq -r '[.pins[] | "\(.identity) \(.state.version)"] | join(", ")' Package.resolved)
          repo=$GITHUB_REPOSITORY
          head=$(git rev-parse HEAD)
          args=()
          for file in Package.resolved app/Package.resolved; do
            blob=$(gh api "repos/$repo/git/blobs" -f encoding=base64 -f content="$(base64 -w0 "$file")" -q .sha)
            args+=(-f "tree[][path]=$file" -f "tree[][mode]=100644" -f "tree[][type]=blob" -f "tree[][sha]=$blob")
          done
          tree=$(gh api "repos/$repo/git/trees" -f base_tree="$(git rev-parse 'HEAD^{tree}')" "${args[@]}" -q .sha)
          commit=$(gh api "repos/$repo/git/commits" -f message="fix(deps): newest kits: $kits" \
            -f tree="$tree" -f "parents[]=$head" -q .sha)
          gh api -X PATCH "repos/$repo/git/refs/heads/main" -f sha="$commit" -F force=false > /dev/null
          git fetch -q origin main && git checkout -q FETCH_HEAD
          echo "committed ${commit:0:7} on main: $kits"
      - if: steps.open.outputs.open == ''
        run: |
          last=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*')
          next=$(npx --yes git-cliff@2.14.2 --bumped-version)
          if [ "$next" = "$last" ]; then
            echo "nothing cut: no feat, fix, perf or breaking change since $last"
            exit 0
          fi
          git tag "rc-$next"
          git push origin "refs/tags/rc-$next"
          echo "release candidate rc-$next: $(git log -1 --format='%h %s')"
