# PRHub's hourly release, started by jai/ci's release-clock Worker (workflow_dispatch) at the top of each hour. When
# main's head has a feat or fix since the newest vX.Y.Z tag (release/version.mjs plan), it runs the full tests on
# GitHub's Macs (ios.yml) on that commit, and when they pass tags it with the next version and makes its GitHub
# Release (release/version.mjs publish). The tag starts Xcode Cloud's tag-started workflow, which builds that commit for
# TestFlight. Red tests release nothing, and a head whose release failed is not tried again until a new push, or a run
# by hand with retry. And the newest build each TestFlight group can install, for the app's "Update available":
# release/app-latest.mjs writes it to app-latest.json on the branch ci/app-latest, which the Workers' GET
# /device/config reads.
name: hourly-release

on:
  push:
    branches: [main]
    paths: [release/version*.mjs, release/app-latest*.mjs, .github/workflows/hourly-release.yml]
  workflow_dispatch:
    inputs:
      retry:
        description: "Try main's head again even if its release failed before."
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: hourly-release
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node --test release/version.test.mjs release/app-latest.test.mjs

  decide:
    if: github.event_name != 'push'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.decide.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - id: decide
        run: |
          head=$(git rev-parse origin/main)
          # A head whose release run failed before (red tests) waits for the next push, or a run with retry.
          failed=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/hourly-release.yml/runs?head_sha=$head&status=failure&per_page=1" -q .total_count)
          if [[ $failed != 0 && $RETRY != true ]]; then
            echo "nothing to release: a release of ${head:0:7} failed before"
            exit 0
          fi
          node release/version.mjs plan
        env:
          RETRY: ${{ inputs.retry }}
          GH_TOKEN: ${{ github.token }}

  ios:
    needs: decide
    if: needs.decide.outputs.sha != ''
    uses: ./.github/workflows/ios.yml
    with:
      ref: ${{ needs.decide.outputs.sha }}

  release:
    needs: [decide, ios]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      HAS_APP_KEY: ${{ secrets.JAI_AGENTS_PRIVATE_KEY != '' }}
    steps:
      # The jai-agents GitHub App token can tag a commit that changes .github/workflows;
      # github.token cannot (no workflows permission). github.token is the fallback until the repo has the App's key.
      - id: app-token
        if: env.HAS_APP_KEY == 'true'
        uses: actions/create-github-app-token@v2
        with:
          app-id: 5757830
          private-key: ${{ secrets.JAI_AGENTS_PRIVATE_KEY }}
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node release/version.mjs publish "$SHA"
        env:
          SHA: ${{ needs.decide.outputs.sha }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token || github.token }}

  app-latest:
    if: github.event_name != 'push'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node release/app-latest.mjs
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          GITHUB_TOKEN: ${{ github.token }}
