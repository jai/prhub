# test-integration-ios (make test-integration-ios): swift test on PRHubIntegrationTests, the app's persistence and
# Keychain, on a Mac. On each push to main that changes the app or PRKit (the app contains it), and in each ios release
# (release.yml).
# Prepare: the checkout. Test: make test-integration-ios. Clean up: GitHub discards the VM after the job.
name: test-integration-ios

on:
  push:
    branches: [main]
    paths: ["app/**", "PRKit/**", "Package.swift", "Package.resolved", "Makefile", ".github/workflows/test-integration-ios.yml"]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: check-test-integration-ios-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

jobs:
  test-integration-ios:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - run: make test-integration-ios
