# Local storage and service tests on macOS, on push and release candidates.
name: test-integration-ios

on:
  push:
    branches: [main]
    paths: ["app/**", "PRKit/**", "Package.swift", "Package.resolved", "DESIGN.md", ".swiftlint.yml", ".swiftformat", "Makefile", ".github/workflows/test-integration-ios.yml"]
  workflow_call:

permissions:
  contents: read

jobs:
  test-integration-ios:
    runs-on: [self-hosted, zoomies, mac]
    timeout-minutes: 10
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v5
        with:
          cache: false
      - run: make test-integration-ios
      - name: Remove disposable products
        if: always()
        run: rm -rf -- .build app/build app/*.xcodeproj worker/node_modules worker/.wrangler agent/node_modules
