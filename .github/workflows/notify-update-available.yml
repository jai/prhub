# notify-update-available (docs/workflow.md): each hour, release/app-latest.mjs asks App Store Connect for the newest
# build each TestFlight group can install and writes it to app-latest.json on the branch ci/app-latest, which the
# Worker's GET /device/config reads for the app's "Update available" (docs/api.md, "App updates"). jai/ci's
# release-clock starts it, through workflow_dispatch.
name: notify-update-available

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: notify-update-available
  cancel-in-progress: false

jobs:
  notify-update-available:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node --test release/app-latest.test.mjs
      - run: node release/app-latest.mjs
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          GITHUB_TOKEN: ${{ github.token }}
