# The agent/ tests (make test-integration-worker): they start a real git and a local server. On each push that changes the Worker, and in each worker release.
name: test-integration-worker

on:
  push:
    branches: [main]
    paths: ["worker/**", "agent/**", "deploy/hosted/**", "docs/fixtures/**", "scripts/ask-trace.sh", "Makefile", ".github/workflows/test-integration-worker.yml"]
  workflow_call:

permissions:
  contents: read

jobs:
  test-integration-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: jdx/mise-action@v5
      - run: make test-integration-worker
