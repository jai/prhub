# lint-prkit (make lint-prkit): SwiftFormat, SwiftLint with DESIGN.md's token rules, and gitleaks on PRKit. On each push
# to main that changes PRKit, and in each ios and prkit release (release.yml).
# Prepare: mise (the pinned tools). Lint: make lint-prkit. Clean up: nothing to do; the GitHub-hosted VM is discarded
# after the job.
name: lint-prkit

on:
  push:
    branches: [main]
    paths: ["PRKit/**", "Package.swift", "Package.resolved", ".swiftlint.yml", ".gitleaks.toml", "Makefile", ".github/workflows/lint-prkit.yml"]
  workflow_call:

permissions:
  contents: read

jobs:
  lint-prkit:
    # 24.04: SwiftLint's Linux build needs libxml2.so.2, which 26.04 (ubuntu-latest) no longer has.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v5
      - run: make lint-prkit
