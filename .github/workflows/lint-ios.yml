# lint-ios: the app's lint (make lint-ios) on Linux, and a build of the shipped iPhone and Mac app (make build-ios) on a
# Mac. On each push to main that changes the app or PRKit (the app contains it), and in each ios release (release.yml).
# Prepare: Node (the design-token check) and mise (the pinned tools). Lint or build: the make target. Clean up: nothing
# to do in the jobs. The GitHub-hosted VM is discarded after lint-ios; the ephemeral Zoomies runner deletes its work
# folder (the checkout, the generated project and DerivedData) after build-ios (docs/workflow.md, "Disk use").
name: lint-ios

on:
  push:
    branches: [main]
    paths: ["app/**", "PRKit/**", "Package.swift", "Package.resolved", "DESIGN.md", ".swiftlint.yml", ".gitleaks.toml", "Makefile", ".github/workflows/lint-ios.yml"]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: check-lint-ios-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

jobs:
  lint-ios:
    # 24.04: SwiftLint's Linux build needs libxml2.so.2, which 26.04 (ubuntu-latest) no longer has.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: jdx/mise-action@v5
      - run: make lint-ios
  build-ios:
    runs-on: [self-hosted, zoomies, mac]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      # No cache restore: the Mac keeps mise's installs between jobs.
      - uses: jdx/mise-action@v5
        with:
          cache: false
      - run: make build-ios
