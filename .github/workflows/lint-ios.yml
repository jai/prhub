# The ios component's lint (make lint-ios): SwiftFormat, SwiftLint with DESIGN.md's token rules, the design-token check, gitleaks. On each push that changes the app, and in each ios release.
name: lint-ios

on:
  push:
    branches: [main]
    paths: ["app/**", "PRKit/**", "Package.swift", "Package.resolved", "DESIGN.md", ".swiftlint.yml", ".swiftformat", "Makefile", ".github/workflows/lint-ios.yml"]
  workflow_call:

permissions:
  contents: read

jobs:
  lint-ios:
    # 24.04: SwiftLint's Linux build needs libxml2.so.2, which 26.04 (ubuntu-latest) no longer has.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: jdx/mise-action@v5
      - run: make lint-ios
      - name: Remove disposable products
        if: always()
        run: rm -rf -- .build app/build app/*.xcodeproj worker/node_modules worker/.wrangler agent/node_modules
  build:
    runs-on: [self-hosted, zoomies, mac]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v5
        with:
          cache: false
      - name: Prepare the project
        run: mise exec xcodegen@2.46.0 -- xcodegen generate --spec app/project.yml --quiet
      - name: Compile shipped iPhone and Mac targets
        run: |
          xcodebuild build -project app/PRHub.xcodeproj -scheme PRHub -destination 'generic/platform=iOS Simulator' -derivedDataPath app/build/iOS -jobs 4 CODE_SIGNING_ALLOWED=NO
          xcodebuild build -project app/PRHub.xcodeproj -scheme PRHub -destination 'platform=macOS' -derivedDataPath app/build/macOS -jobs 4 CODE_SIGNING_ALLOWED=NO
      - name: Remove disposable build products
        if: always()
        run: rm -rf -- .build app/build app/*.xcodeproj
