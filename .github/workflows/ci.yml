# The fast checks, on every push to main and before every release (release.yml). Three jobs, so a red one says which:
#   Lint              make lint, make typecheck: formatters' checks, SwiftLint (with DESIGN.md's token rules), oxlint,
#                     ruff, actionlint, ShellCheck, gitleaks (secrets and private names: this repo is public), type checks
#   Unit Tests        make test: PRKit's swift test; the Worker's and the AI container's node tests
#   Unit Tests (app)  make test-app: the app's unit tests on an iPhone Simulator
# The slow UI tests are test-ui.yml. On GitHub's runners (Xcode 27.2 image), free for a public repo.
name: ci

on:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.sha }}

jobs:
  lint:
    name: Lint
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      - run: sudo xcode-select -s /Applications/Xcode_27.2.app
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: make setup
      - run: make lint typecheck

  test:
    name: Unit Tests
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      - run: sudo xcode-select -s /Applications/Xcode_27.2.app
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: make setup
      - run: make test

  test-app:
    name: Unit Tests (app)
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      - run: sudo xcode-select -s /Applications/Xcode_27.2.app
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v5
      - run: make test-app
