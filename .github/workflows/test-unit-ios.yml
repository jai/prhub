# The app's unit tests (make test-unit-ios): swift test on PRHubUnitTests, with no simulator. On each push that changes the app, and in each ios release.
name: test-unit-ios

on:
  push:
    branches: [main]
    paths: ["app/**", "PRKit/**", "Package.swift", "Package.resolved", "DESIGN.md", ".swiftlint.yml", ".swiftformat", "Makefile", ".github/workflows/test-unit-ios.yml"]
  workflow_call:

permissions:
  contents: read

jobs:
  test-unit-ios:
    runs-on: [self-hosted, zoomies, mac]
    timeout-minutes: 10
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v5
      - run: make test-unit-ios
      - name: Remove disposable products
        if: always()
        run: rm -rf -- .build app/build app/*.xcodeproj worker/node_modules worker/.wrangler agent/node_modules
