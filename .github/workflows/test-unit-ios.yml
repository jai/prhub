# test-unit-ios (make test-unit-ios): swift test on PRHubUnitTests, on a Mac, with no Simulator. On each push to main
# that changes the app or PRKit (the app contains it), and in each ios release (release.yml).
# Prepare: the checkout. Test: make test-unit-ios. Clean up: GitHub discards the VM after the job.
name: test-unit-ios

on:
  push:
    branches: [main]
    paths: ["app/**", "PRKit/**", "Package.swift", "Package.resolved", "Makefile", ".github/workflows/test-unit-ios.yml"]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: check-test-unit-ios-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

jobs:
  test-unit-ios:
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - run: make test-unit-ios
