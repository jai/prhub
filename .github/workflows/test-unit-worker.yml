# The Worker's unit tests (make test-unit-worker). On each push that changes the Worker, and in each worker release.
name: test-unit-worker

on:
  push:
    branches: [main]
    paths: ["worker/**", "agent/**", "deploy/hosted/**", "PRKit/Tests/PRContractFixtures/Fixtures/**", "scripts/ask-trace.sh", "Makefile", ".github/workflows/test-unit-worker.yml"]
  workflow_call:

permissions:
  contents: read

jobs:
  test-unit-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: jdx/mise-action@v5
      - run: make test-unit-worker
