# test-unit-worker (make test-unit-worker): the Worker's and the agent's unit tests (Vitest project unit). On each push
# to main that changes the Worker, and in each worker release (release.yml).
# Prepare: Node and the npm dependencies. Test: make test-unit-worker. Clean up: nothing to do; the GitHub-hosted VM is
# discarded after the job.
name: test-unit-worker

on:
  push:
    branches: [main]
    paths: ["worker/**", "agent/**", "deploy/hosted/**", "PRKit/Tests/PRContractFixtures/Fixtures/**", "Makefile", ".github/workflows/test-unit-worker.yml"]
  workflow_call:

permissions:
  contents: read

jobs:
  test-unit-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install the npm dependencies
        run: |
          npm ci --prefix worker --no-audit --no-fund
          npm ci --prefix agent --no-audit --no-fund
      - run: make test-unit-worker
