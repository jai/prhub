# lint-workflows (make lint-workflows): actionlint on the workflow files, on each push to main that changes them.
# Prepare: mise (actionlint). Lint: make lint-workflows. Clean up: nothing to do; the GitHub-hosted VM is discarded
# after the job.
name: lint-workflows

on:
  push:
    branches: [main]
    paths: [".github/workflows/**", ".github/actionlint.yaml"]

permissions:
  contents: read

jobs:
  lint-workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v5
      - run: make lint-workflows
