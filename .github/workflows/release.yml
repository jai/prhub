# release (docs/workflow.md): on each rc-<component>-v<version>-<short hash> tag, the component's lint and tests run on
# that commit through workflow_call, so the concurrency group holds until the end. All green: the release tag
# (ios-v<version>, worker-v<version>, or v<version> for prkit) and the GitHub Release, with git-cliff's notes. A red check
# stops the release; the next RC gets the same version. RC tags stay, as the record of what was tested.
# ios-v starts Xcode Cloud ("PRHub TestFlight Internal and External"); worker-v starts deploy-worker.yml.
#
# Order within a component, cheapest first: lint and unit tests start together; integration tests wait for their unit
# tests; the ios UI tests wait for every other ios check, so a long Simulator run never holds the Mac for a commit
# that a cheaper check already failed. The app contains PRKit, so an ios release runs PRKit's checks too.
# Only each component's first jobs name its RC tags: a job that needs a skipped job is skipped too.
name: release

on:
  push:
    tags: ["rc-ios-v*", "rc-worker-v*", "rc-prkit-v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ startsWith(github.ref_name, 'rc-ios-') && 'ios' || startsWith(github.ref_name, 'rc-worker-') && 'worker' || 'prkit' }}
  cancel-in-progress: false

jobs:
  # ---- ios: the app, and PRKit inside it ----
  lint-ios:
    if: startsWith(github.ref_name, 'rc-ios-')
    uses: ./.github/workflows/lint-ios.yml
  test-unit-ios:
    if: startsWith(github.ref_name, 'rc-ios-')
    uses: ./.github/workflows/test-unit-ios.yml
  test-integration-ios:
    needs: [test-unit-ios]
    uses: ./.github/workflows/test-integration-ios.yml
  test-ui-ios:
    needs: [lint-ios, test-unit-ios, test-integration-ios, lint-prkit, test-unit-prkit, test-integration-prkit]
    uses: ./.github/workflows/test-ui-ios.yml

  # ---- prkit: in prkit and ios releases ----
  lint-prkit:
    if: startsWith(github.ref_name, 'rc-prkit-') || startsWith(github.ref_name, 'rc-ios-')
    uses: ./.github/workflows/lint-prkit.yml
  test-unit-prkit:
    if: startsWith(github.ref_name, 'rc-prkit-') || startsWith(github.ref_name, 'rc-ios-')
    uses: ./.github/workflows/test-unit-prkit.yml
  test-integration-prkit:
    needs: [test-unit-prkit]
    uses: ./.github/workflows/test-integration-prkit.yml

  # ---- worker ----
  lint-worker:
    if: startsWith(github.ref_name, 'rc-worker-')
    uses: ./.github/workflows/lint-worker.yml
  test-unit-worker:
    if: startsWith(github.ref_name, 'rc-worker-')
    uses: ./.github/workflows/test-unit-worker.yml
  test-integration-worker:
    needs: [test-unit-worker]
    uses: ./.github/workflows/test-integration-worker.yml

  # ---- The release: every check above that ran passed (the other components' checks are skipped) ----
  release:
    needs: [lint-ios, test-unit-ios, test-integration-ios, test-ui-ios, lint-prkit, test-unit-prkit, test-integration-prkit, lint-worker, test-unit-worker, test-integration-worker]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The jai-agents App's token, made here after the tests (it stops after 1 hour). A tag or release made with
      # github.token starts no workflow, so neither Xcode Cloud's start nor deploy-worker.yml would follow.
      - id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: 5757830
          private-key: ${{ secrets.JAI_AGENTS_PRIVATE_KEY }}
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      # The component's paths are generate-release-candidate.yml's: git-cliff's notes cover the same commits.
      - name: Tag the release and write its notes
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          rest=${GITHUB_REF_NAME#rc-}
          component=${rest%%-*}
          version=${rest#"$component"-v}
          version=${version%-*}
          case $component in
            ios) prefix=ios-v; paths=(app PRKit Package.swift Package.resolved DESIGN.md .swiftlint.yml Makefile .github/workflows .gitleaks.toml cliff.toml) ;;
            worker) prefix=worker-v; paths=(worker agent deploy/hosted PRKit/Tests/PRContractFixtures/Fixtures scripts/ask-trace.sh Makefile .github/workflows .gitleaks.toml cliff.toml) ;;
            prkit) prefix=v; paths=(PRKit Package.swift Package.resolved .swiftlint.yml Makefile .github/workflows .gitleaks.toml cliff.toml) ;;
          esac
          tag="$prefix$version"
          include=()
          for path in "${paths[@]}"; do
            if [ -d "$path" ]; then include+=(--include-path "$path/**"); else include+=(--include-path "$path"); fi
          done
          npx --yes git-cliff@2.14.2 --unreleased --tag "$tag" --strip all \
            --tag-pattern "^${prefix}[0-9]+\.[0-9]+\.[0-9]+$" "${include[@]}" > "$RUNNER_TEMP/notes.md"
          git -c user.name='jai-agents[bot]' -c user.email='356602356+jai-agents[bot]@users.noreply.github.com' \
            tag -a "$tag" -F "$RUNNER_TEMP/notes.md"
          git push origin "refs/tags/$tag"
          gh release create "$tag" --verify-tag --title "$tag" --notes-file "$RUNNER_TEMP/notes.md"
