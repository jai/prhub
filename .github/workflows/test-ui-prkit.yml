# PRKit's native Mac rendering checks, only on a release candidate.
name: test-ui-prkit

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test-ui-prkit:
    runs-on: xcode-27
    timeout-minutes: 10
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      - run: sudo xcode-select -s /Applications/Xcode_27.2.app
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v5
      - run: make test-ui-prkit
