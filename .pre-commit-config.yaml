# PRHub's git hooks (docs/workflow.md, "Hooks"), run by prek. Orca installs them in each new worktree (orca.yaml).
# Before each commit: `make fix` on the staged files, then `make lint-<component>` for each component with staged
# files. Before each push: `make test-unit-<component>` for each component the push changes.
# Like pre-commit, prek sets unstaged changes aside while the hooks run, but not untracked files: a lint of a whole
# component also reads the untracked files in its folders.
repos:
  - repo: local
    hooks:
      # Each lint tool fixes what it can in the staged files, and the fixes go back into the commit. A staged DESIGN.md
      # regenerates the design tokens (make -C app design), which go into the commit too.
      - id: fix
        name: make fix
        entry: >-
          bash -c 'make fix FILES="$*" && git add -- "$@" &&
          if [[ " $* " == *" DESIGN.md "* ]]; then
          git add -- app/PRHub/Assets.xcassets PRKit/Sources/PRKitDesign/DesignTokens.swift; fi' --
        language: system
        require_serial: true
        files: '(\.swift|^(worker|agent)/.*\.(ts|tsx|mts|cts|js|mjs|cjs)|^DESIGN\.md)$'
        stages: [pre-commit]
      - id: lint-ios
        name: make lint-ios
        entry: make lint-ios
        language: system
        pass_filenames: false
        files: '^(app/|DESIGN\.md$|\.swiftlint\.yml$|\.gitleaks\.toml$)'
        stages: [pre-commit]
      - id: lint-prkit
        name: make lint-prkit
        entry: make lint-prkit
        language: system
        pass_filenames: false
        files: '^(PRKit/|Package\.(swift|resolved)$|\.swiftlint\.yml$|\.gitleaks\.toml$)'
        stages: [pre-commit]
      - id: lint-worker
        name: make lint-worker
        entry: make lint-worker
        language: system
        pass_filenames: false
        files: '^(worker/|agent/|deploy/hosted/|scripts/ask-trace\.sh$|\.gitleaks\.toml$)'
        stages: [pre-commit]
      - id: lint-workflows
        name: make lint-workflows
        entry: make lint-workflows
        language: system
        pass_filenames: false
        files: '^\.github/(workflows/|actionlint\.yaml$)'
        stages: [pre-commit]
      # The two work domains are split by quotes, so gitleaks (.gitleaks.toml), which keeps them out of this public
      # repo, passes this file.
      - id: block-work-email-author
        name: the author is not a work address
        entry: >-
          sh -c 'case "$(git var GIT_AUTHOR_IDENT)" in
          *"@e"wa-services.com">"*|*"@f"inn-app.com">"*)
          echo "This commit is by a work address; this repo takes jai@govindani.com:
          git config user.email jai@govindani.com" >&2; exit 1;; esac'
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-commit]
      # SwiftPM checks its packages out with git: in a worktree the hook's GIT_DIR and friends send that checkout to
      # this repo instead ("unable to read tree"). githooks(5): clear them with git rev-parse --local-env-vars.
      - id: test-unit-ios
        name: make test-unit-ios
        entry: sh -c 'unset $(git rev-parse --local-env-vars); exec make test-unit-ios'
        language: system
        pass_filenames: false
        files: '^(app/|PRKit/|Package\.(swift|resolved)$)'
        stages: [pre-push]
      - id: test-unit-prkit
        name: make test-unit-prkit
        entry: sh -c 'unset $(git rev-parse --local-env-vars); exec make test-unit-prkit'
        language: system
        pass_filenames: false
        files: '^(PRKit/|Package\.(swift|resolved)$)'
        stages: [pre-push]
      - id: test-unit-worker
        name: make test-unit-worker
        entry: make test-unit-worker
        language: system
        pass_filenames: false
        files: '^(worker/|agent/|PRKit/Tests/PRContractFixtures/Fixtures/)'
        stages: [pre-push]
